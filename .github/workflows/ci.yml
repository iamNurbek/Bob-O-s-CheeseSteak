name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: bobos-site

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: bobos-site/.nvmrc
          cache: npm
          cache-dependency-path: bobos-site/package-lock.json
      - run: npm ci
      # Gate order from the plan: a red step blocks merging.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: bobos-site/playwright-report
